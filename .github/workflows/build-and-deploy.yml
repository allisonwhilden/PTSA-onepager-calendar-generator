name: Build and Deploy Calendar PDF

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'python/**'
      - 'web/**'
      - 'pytest.ini'
      - '.github/workflows/build-and-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'data/**'
      - 'python/**'
      - 'web/**'
      - 'pytest.ini'
      - '.github/workflows/build-and-deploy.yml'
  workflow_dispatch:

  # The calendar.pdf link always means "the current school year", and which
  # year that is changes on 1 August without anybody pushing anything. Until
  # this schedule existed nothing rebuilt on that date, so the cutover waited
  # for the next unrelated commit -- and if none came, the link kept serving
  # last year's calendar into the new one. This is also the nudge to add the
  # new year: from 1 August, a run with no config for it publishes nothing and
  # says so in the job summary.
  schedule:
    - cron: '17 13 * * *'      # 06:17 Pacific, give or take daylight saving

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            python/requirements.txt
            web/requirements.txt

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev libcairo2 libpango-1.0-0 \
            libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libffi-dev shared-mime-info

      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          # Both: `pytest` covers the editor as well as the renderer, and the
          # editor's tests drive the real app against a real repository.
          pip install -r python/requirements.txt -r web/requirements.txt

      - name: Validate event data
        run: python python/build.py --check --strict

      - name: Test
        # No path argument: naming one here overrides pytest.ini's testpaths,
        # which is how the editor's 119 tests were collected by nobody.
        run: python -m pytest

      # The filename carries the school year, which build.py derives from the
      # configs in data/years -- so nothing here needs editing in a new year.
      - name: Build PDF
        run: |
          mkdir -p dist
          python python/build.py --out-dir dist
          echo "PDF=$(ls dist/*.pdf | head -1)" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: calendar-pdf
          path: dist/*.pdf

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          # The published PDF sits behind a link the README calls "the current
          # calendar". Serving a school year that has already ended is the same
          # silent staleness this pipeline exists to prevent, so say so loudly
          # and publish nothing rather than overwrite it.
          # Exit 3 means "the year has ended", which is a routine skip. Any
          # other non-zero exit is a real failure and must not be reported as
          # one -- that is how a broken build gets a green check.
          set +e
          LABEL="$(python python/build.py --require-current-year --print-label)"
          probe=$?
          set -e

          if [ "$probe" -ne 0 ] && [ "$probe" -ne 3 ]; then
            echo "::error::build.py failed with exit $probe"
            exit "$probe"
          fi

          if [ "$probe" -eq 3 ]; then
            {
              echo "### Calendar not published"
              echo
              echo "There is no config for the current school year, so the only"
              echo "calendar that can be built has already ended. Publishing it"
              echo 'would put a stale calendar behind the "current calendar" link.'
              echo
              echo 'Add `data/years/<year>.toml` and this year'"'"'s rows in'
              echo '`data/all_events.csv`. See `data/years/README.md`.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Skipped publishing: no config for the current school year."
            exit 0
          fi

          # The newest year with a config, which in spring is next year. The
          # docs promise a permanent link to it so it can be shared for review
          # before 1 August, and until this the deploy only ever built the
          # current year -- so that link 404'd until the day it stopped being
          # needed. build.py cannot be asked for "newest" (resolve_start_year
          # prefers the current year whenever it has a config, which is the
          # right answer for every other caller), so read the directory.
          NEWEST="$(ls data/years/*.toml | sed 's|.*/||; s|\.toml$||' \
                    | sort | tail -1)"

          NAME="$(basename "$PDF")"
          ORG="$(python python/build.py --print-organization)"
          # Escaped for the heredoc below: "Smith & Jones PTSA" would otherwise
          # write a bare ampersand into the published page. render.py escapes the
          # same value for the PDF via Jinja autoescape.
          ORG_HTML="$(python -c 'import html,sys; print(html.escape(sys.argv[1]))' "$ORG")"
          LABEL_HTML="$(python -c 'import html,sys; print(html.escape(sys.argv[1]))' "$LABEL")"
          cp "$PDF" /tmp/calendar.pdf

          NEXT_READY=""
          if [ "$NEWEST" != "$LABEL" ]; then
            # Deliberately allowed to fail. A config for next year usually
            # appears before next year's dates do -- that is the normal middle
            # of a year roll -- and a half-staged next year must not take the
            # current year's calendar off the website with it.
            echo "Also building $NEWEST so it has a link before it goes live."
            if python python/build.py --year "${NEWEST%%-*}" --out /tmp/next.pdf
            then
              NEXT_READY="yes"
            else
              rm -f /tmp/next.pdf
              {
                echo "### $NEWEST is not ready to preview"
                echo
                echo "Its config exists but it does not build yet, so only"
                echo "$LABEL was published. This is the normal state part way"
                echo "through a year roll."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::$NEWEST has a config but does not build yet."
            fi
          fi
          rm -rf dist

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git fetch origin gh-pages:refs/remotes/origin/gh-pages || true

          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout -B gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rqf . || true
          fi

          # gh-pages has no .gitignore of its own, so leftovers from the build
          # (__pycache__, .pytest_cache) would otherwise be swept up by `add -A`
          # and published to the public site.
          git clean -fdxq

          # Nothing here changed unless the source did. index.html carries
          # today's date and so does the PDF footer, so the "no changes"
          # guard below can never fire on its own -- which was fine while
          # publishing meant somebody pushing, and is 365 commits a year now
          # that this runs daily. The stamp carries the year labels too, so
          # the 1 August rollover still republishes on an unchanged source.
          # Built after NEXT_READY is known, not before it. This block used to
          # sit above the build that assigns it, and the whole step runs under
          # `set -u`, so every push and every scheduled run died here with
          # "NEXT_READY: unbound variable" -- after building the PDF and before
          # publishing anything.
          NEXT_LINK_HTML=""
          if [ -n "$NEXT_READY" ]; then
            NEXT_HTML="$(python -c 'import html,sys; print(html.escape(sys.argv[1]))' "$NEWEST")"
            NEXT_LINK_HTML="<br>Next year, for review before it goes live: <a href=\"calendar-$NEXT_HTML.pdf\">calendar-$NEXT_HTML.pdf</a>"
          fi

          STAMP="$GITHUB_SHA $LABEL $NEWEST ${NEXT_READY:-no}"
          if [ "$(cat .published 2>/dev/null)" = "$STAMP" ]; then
            echo "Already published: $STAMP" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s' "$STAMP" > .published

          cp /tmp/calendar.pdf calendar.pdf
          # Stamped with the school year, not the date it was built. A
          # date-stamped copy was one new file per publish, which was tolerable
          # while publishing meant somebody pushing a commit and is not now
          # that this runs daily -- it would add 365 files a year. The year is
          # also the stamp somebody actually wants a link to: next year's
          # calendar can be shared as calendar-2027-28.pdf before 1 August,
          # while calendar.pdf still means the year we are in.
          cp /tmp/calendar.pdf "calendar-$LABEL.pdf"
          if [ -f /tmp/next.pdf ]; then
            cp /tmp/next.pdf "calendar-$NEWEST.pdf"
          fi

          cat > index.html <<HTML
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>$ORG_HTML Calendar $LABEL_HTML</title>
            <style>
              body { font-family: system-ui, -apple-system, Arial, sans-serif;
                     margin: 0 auto; max-width: 60rem; padding: 2rem 1.25rem 4rem;
                     color: #15181d; background: #fff; }
              h1 { color: #C40A0C; font-size: 1.6rem; margin: 0 0 .25rem; }
              p.sub { color: #555d6a; margin: 0 0 1.5rem; }
              a.btn { background: #C40A0C; color: #fff; padding: .7rem 1.2rem;
                      text-decoration: none; border-radius: 4px;
                      display: inline-block; font-weight: 600; }
              iframe { width: 100%; height: 80vh; margin-top: 1.5rem;
                       border: 1px solid #e1e5eb; border-radius: 4px; }
            </style>
          </head>
          <body>
            <h1>$ORG_HTML Calendar $LABEL_HTML</h1>
            <p class="sub">Updated $(date +'%B %-d, %Y') &middot; one page, Letter size.</p>
            <a class="btn" href="calendar.pdf" download="$NAME">Download PDF</a>
            <p class="sub" style="margin-top:1rem">
              This link always points at the current school year.
              A permanent link to this year in particular:
              <a href="calendar-$LABEL_HTML.pdf">calendar-$LABEL_HTML.pdf</a>
              $NEXT_LINK_HTML
            </p>
            <iframe src="calendar.pdf" title="Calendar preview"></iframe>
          </body>
          </html>
          HTML

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          # Any commit failure past this point is real -- an empty index is the
          # only benign case and it is handled above. Swallowing it here is how
          # a failed publish gets a green check.
          git commit -m "Calendar $LABEL from ${GITHUB_SHA::7}"
          git push origin gh-pages
